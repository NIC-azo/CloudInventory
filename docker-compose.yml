name: cloudinventory
services:
  db:
    image: postgres:17-alpine
    restart: unless-stoped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cloudinventory" ]
      interval: 5s
      timeout: 7s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: [ "pnpm", "dev" ]
    environment:
      - NODE_ENV: ${NODE_ENV}
      - PORT: ${BACKEND_PORT}
      - DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?schema=public
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./backend/src/server.ts
          target: /app/src/server.ts
          initial_sync: true
        - action: sync+exec
          path: ./backend/prisma/contract.prisma
          target: /app/prisma/contract.prisma
          initial_sync: true
          exec:
            command: pnpm prisma:emit
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/prisma.config.ts
        - action: rebuild
          path: ./backend/Dockerfile.dev

volumes:
  postgres_data:
